name: Build SecretPlay Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretplay-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      # flutter_vodozemac builds native Rust code through cargokit.
      # Cache is disabled because there is no Cargo.toml at the repository root.
      - name: Set up Rust Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache: false
          rustflags: ''

      - name: Verify Flutter and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          DART_VERSION_LINE="$(dart --version 2>&1)"
          printf '%s\n' "$DART_VERSION_LINE"
          if ! printf '%s\n' "$DART_VERSION_LINE" | grep -Eq 'Dart SDK version: 3\.14\.[0-9]+ \(stable\)'; then
            echo "Expected stable Dart 3.14.x from Flutter 3.50.0." >&2
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # Create the Gradle wrapper before flutter build invokes Gradle.
      # The helper verifies both the official distribution and wrapper JAR hashes.
      - name: Generate checksum-pinned Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ensure-gradle-wrapper.sh

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s android_app/android/gradlew
          test -s android_app/android/gradlew.bat
          test -s android_app/android/gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'gradle-9.5.0-bin.zip' android_app/android/gradle/wrapper/gradle-wrapper.properties
          grep -Fxq 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' android_app/android/gradle/wrapper/gradle-wrapper.properties
          sha256sum --check <(printf '%s  %s\n' \
            '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7' \
            'android_app/android/gradle/wrapper/gradle-wrapper.jar')
          chmod +x android_app/android/gradlew

      - name: Build debug APK
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub

          APK="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file was not generated!" >&2
            exit 1
          fi

          echo "APK successfully built:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SecretPlay-Android-APK
          path: android_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
