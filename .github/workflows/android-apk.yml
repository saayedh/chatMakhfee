name: Build SecretPlay Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretplay-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        name: Checkout source
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        name: Set up Java 17
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        name: Set up Android SDK
        with:
          accept-android-sdk-licenses: true

      - run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
        name: Install Android SDK packages
        shell: bash

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        name: Set up Flutter stable
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # flutter_vodozemac compiles native Rust code for Android through cargokit.
      # Disable Rust caching because the repository has no root Cargo.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        name: Set up Rust Android targets
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache: false
          rustflags: ''

      - run: |
          set -euo pipefail
          flutter --version
          DART_VERSION_LINE="$(dart --version 2>&1)"
          printf '%s\n' "$DART_VERSION_LINE"
          if ! printf '%s\n' "$DART_VERSION_LINE" | grep -Eq 'Dart SDK version: 3\.13\.7 \(stable\)'; then
            echo "Expected Dart 3.13.7 stable from Flutter 3.47.9." >&2
            exit 1
          fi
        name: Verify Flutter and Dart toolchain
        shell: bash

      - run: flutter pub get
        name: Resolve Flutter dependencies
        working-directory: android_app
        shell: bash

      - run: |
          set -euo pipefail
          GRADLE_VERSION="8.14.3"
          GRADLE_SHA256="bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"

          FLUTTER_BIN="$(command -v flutter)"
