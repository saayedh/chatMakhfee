name: Build SecretPlay Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretplay-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # flutter_vodozemac compiles native Rust code for Android through cargokit.
      # Caching is disabled because this repository has no root Cargo.toml.
      - name: Set up Rust Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache: false
          rustflags: ''

      - name: Verify Flutter and Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          DART_VERSION_LINE="$(dart --version 2>&1)"
          echo "$DART_VERSION_LINE"
          if ! printf '%s\n' "$DART_VERSION_LINE" | grep -Eq 'Dart SDK version: 3\.13\.7 \(stable\)'; then
            echo "Expected Dart 3.13.7 stable from Flutter 3.47.9." >&2
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: android_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # The repository contains gradle-wrapper.properties but intentionally does not
      # commit the wrapper JAR or launcher. Generate them on the runner using a
      # checksum-verified Gradle distribution. Project settings use AGP 8.11.1 and
      # Kotlin Gradle Plugin 2.2.20, matching the Flutter 3.47 minimum toolchain.
      - name: Generate Gradle wrapper
