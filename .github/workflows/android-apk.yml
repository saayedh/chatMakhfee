name: Build SecretPlay Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretplay-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.38.0'
          cache: true

      # flutter_vodozemac compiles native Rust code for Android through cargokit.
      - name: Set up Rust Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      # The source archive contains the pinned wrapper properties, while the wrapper
      # launcher/JAR are generated on the runner from the checksum-verified Gradle distribution.
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.14.3"
          GRADLE_SHA256="bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$FLUTTER_BIN")")")"

          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android_app/android/local.properties

          curl --fail --location --silent --show-error \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$GRADLE_ZIP"
          echo "${GRADLE_SHA256}  ${GRADLE_ZIP}" | sha256sum --check --status || {
            echo "Gradle distribution checksum verification failed." >&2
            exit 1
          }

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$GRADLE_HOME/bin/gradle"
          (
            cd android_app/android
            "$GRADLE_HOME/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin
          )
          chmod +x android_app/android/gradlew

          WRAPPER_PROPERTIES="android_app/android/gradle/wrapper/gradle-wrapper.properties"
          if grep -q '^distributionSha256Sum=' "$WRAPPER_PROPERTIES"; then
            sed -i "s/^distributionSha256Sum=.*/distributionSha256Sum=${GRADLE_SHA256}/" "$WRAPPER_PROPERTIES"
          else
            printf '\ndistributionSha256Sum=%s\n' "$GRADLE_SHA256" >> "$WRAPPER_PROPERTIES"
          fi

      - name: Build debug APK
        working-directory: android_app
        run: flutter build apk --debug

      - name: Prepare APK file
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="android_app/build/app/outputs/flutter-apk/app-debug.apk"
          OUTPUT_DIR="artifacts"
          OUTPUT_APK="${OUTPUT_DIR}/SecretPlay-Android.apk"
          test -s "$SOURCE_APK"
          mkdir -p "$OUTPUT_DIR"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          echo "APK ready: $OUTPUT_APK"
          ls -lh "$OUTPUT_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SecretPlay-Android-APK
          path: artifacts/SecretPlay-Android.apk
          if-no-files-found: error
          retention-days: 30
