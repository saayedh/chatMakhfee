name: Build SecretPlay Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secretplay-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # flutter_vodozemac compiles native Rust code for Android through cargokit.
      - name: Set up Rust Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          # This repo has no root Cargo.toml; disable rust-cache so it does not run
          # cargo metadata in the repository root. Cargokit builds its crate in the pub cache.
          cache: false
          # Avoid injecting RUSTFLAGS=-D warnings into third-party Rust crates.
          rustflags: ''

      - name: Verify stable Flutter and Dart SDK
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          DART_VERSION_LINE="$(dart --version 2>&1)"
          echo "$DART_VERSION_LINE"
          if ! echo "$DART_VERSION_LINE" | grep -Eq 'Dart SDK version: 3\.13\.7 \(stable\)' || \
             echo "$DART_VERSION_LINE" | grep -Eiq '(beta|dev|alpha|pre)'; then
            echo "Expected stable Dart 3.13.7 from Flutter 3.47.9; refusing to resolve dependencies with a pre-release or mismatched SDK." >&2
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: android_app
        run: flutter pub get

      # The source archive contains the pinned wrapper properties, while the wrapper
      # launcher/JAR are generated on the runner from the checksum-verified Gradle distribution.
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.14.3"
          GRADLE_SHA256="bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_HOME="$RUNNER_TEMP/gradle-${GRADLE_VERSION}"
